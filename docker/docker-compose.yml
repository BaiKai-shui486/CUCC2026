# ============================================================================
# THU-BDC2026 Docker Compose 配置
# 镜像: bdc2026:latest
#
# 使用方式:
#   docker compose -f app/docker/docker-compose.yml build
#   docker compose -f app/docker/docker-compose.yml up -d
#   docker exec -it bdc2026 bash /app/init.sh
#   docker exec -it bdc2026 bash /app/train.sh
#   docker exec -it bdc2026 bash /app/test.sh
# ============================================================================

services:
  bdc2026:
    image: bdc2026:latest
    container_name: bdc2026
    pull_policy: never
    build:
      context: ..                    # app/ 目录作为构建上下文
      dockerfile: docker/Dockerfile

    # --- GPU 配置 ---
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # --- 挂载目录（data/output/temp 由 compose 挂载；code/model 已打包进镜像） ---
    volumes:
      - ../data:/app/data
      - ../output:/app/output
      - ../temp:/app/temp

    working_dir: /app
    privileged: true
    mem_limit: 16g
    memswap_limit: 16g
    cpus: 10.0
